<style>
    /* Options-page layout, shared by resize / resize_batch.
       Four control shapes only: .seg (one of a few), .sw (independent on/off),
       .num (a magnitude with its unit), and a plain <select> (one of many).
       Everything sits on --control-h so pills, inputs and selects line up. */

    .resize-card {
        max-width: 760px;
        margin: 0 auto;
        /* base.html's .card sets no padding, and the old layout got its
           breathing room from .section-block's own padding. Removing those
           sections left the groups flush against the card border, so the
           cushion lives here now. */
        padding: var(--sp-xl);
        --control-h: 34px;
        --group-gap: 12px;
    }

    .page-header {
        display: flex;
        align-items: center;
        gap: var(--sp-md);
        padding-bottom: var(--sp-lg);
        margin-bottom: var(--sp-xl);
        border-bottom: 1px solid var(--surface-border);
    }

    .page-header a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        border-radius: var(--radius-md);
        color: var(--text-secondary);
        flex-shrink: 0;
        transition: all var(--ease);
    }

    .page-header a:hover { color: var(--text-primary); background: var(--surface-hover); }

    .page-title { flex: 1; min-width: 0; }
    .page-title h1 { font-size: 1.1rem; margin-bottom: 2px; }
    .page-title .filename {
        display: block;
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: var(--text-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .page-title small { color: var(--text-muted); font-size: 0.78rem; }

    .page-header-meta {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: var(--text-muted);
        flex-shrink: 0;
    }

    .badge {
        flex-shrink: 0;
        padding: 3px 10px;
        border-radius: 20px;
        background: var(--accent-subtle);
        border: 1px solid var(--accent);
        color: var(--accent-bright);
        font-size: 0.72rem;
        font-weight: 500;
    }

    /* ---------- legacy layout, still used by the GIF pages ----------
       gif_create.html and gif_edit.html include this stylesheet and have not
       been migrated to the stage/group vocabulary below. These seven classes
       exist only for them; the resize pages no longer reference any of them.
       Remove this block when those two pages move over. */

    .form-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: var(--sp-lg);
    }

    @media (min-width: 640px) {
        .form-grid { grid-template-columns: 1fr 1fr; }
        .col-full  { grid-column: 1 / -1; }
    }

    .section-block {
        padding: var(--sp-md);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        background: var(--surface-card);
        min-width: 0;
    }

    .options-row {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: var(--sp-lg);
        margin-bottom: var(--sp-md);
    }

    @media (max-width: 480px) {
        .options-row { grid-template-columns: 1fr; }
    }

    .dim-row {
        display: flex;
        align-items: flex-end;
        gap: var(--sp-sm);
    }

    .dim-sep { color: var(--text-muted); padding-bottom: 9px; }

    .submit-area { margin-top: var(--sp-xl); }

    /* ---------- stage heading ---------- */

    .stage {
        display: flex;
        align-items: baseline;
        gap: var(--sp-sm);
        margin: var(--sp-xl) 0 var(--sp-md);
    }
    .stage:first-of-type { margin-top: 0; }

    .stage-n {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--accent-subtle);
        border: 1px solid var(--accent-dim);
        color: var(--accent-bright);
        flex-shrink: 0;
    }
    .stage-t { font-size: 0.9rem; font-weight: 600; }
    .stage-h { font-size: 0.72rem; color: var(--text-muted); }

    /* ---------- collapsible group ---------- */

    .opt-group {
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        /* One step above the card, which is itself one step above the page.
           That ladder is what draws the dark frame around each block: the old
           .section-block sat on --surface-raised for the same reason, and
           matching the card's own colour here is what flattened the page. */
        background: var(--surface-raised);
        margin-bottom: var(--group-gap);
        /* Deliberately NOT overflow:hidden. A tooltip is absolutely positioned
           against its own button and sits above it, so clipping the group cuts
           every tooltip in the first row in half. The summary carries its own
           radius instead, which is what overflow was there for. */
        overflow: visible;
    }

    .opt-group > summary {
        display: flex;
        align-items: center;
        gap: var(--sp-md);
        padding: var(--sp-md) var(--sp-lg);
        cursor: pointer;
        list-style: none;
        background: var(--surface-hover);
        border-radius: calc(var(--radius-md) - 1px);
        transition: background var(--ease);
    }
    .opt-group[open] > summary {
        border-radius: calc(var(--radius-md) - 1px) calc(var(--radius-md) - 1px) 0 0;
    }
    .opt-group > summary::-webkit-details-marker { display: none; }
    .opt-group > summary:hover { background: var(--surface-border); }
    .opt-group > summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
    }

    .og-title { font-size: 0.82rem; font-weight: 600; flex-shrink: 0; }

    /* What the group is set to, so a shut group never hides an active value. */
    .og-sum {
        flex: 1;
        min-width: 0;
        text-align: right;
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: var(--text-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .opt-group.is-set .og-sum { color: var(--accent-bright); }

    .og-chev {
        width: 14px;
        height: 14px;
        color: var(--text-muted);
        flex-shrink: 0;
        transition: transform var(--ease);
    }
    .opt-group[open] > summary .og-chev { transform: rotate(180deg); }
    .opt-group[open] > summary .og-sum { opacity: 0; }

    .og-body {
        padding: var(--sp-lg);
        display: flex;
        flex-direction: column;
        gap: var(--sp-lg);
        border-top: 1px solid var(--surface-border);
    }

    /* ---------- field scaffolding ---------- */

    .field { display: flex; flex-direction: column; gap: var(--sp-sm); min-width: 0; }

    .field-label {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 0.72rem;
        font-weight: 500;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.06em;
    }

    .row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--sp-md);
        align-items: flex-end;
    }
    .row-top { align-items: flex-start; }
    .row-x { color: var(--text-muted); padding-bottom: 7px; }

    .hint { font-size: 0.72rem; color: var(--text-muted); margin: 0; }

    .reveal, .reveal-text {
        display: flex;
        flex-direction: column;
        gap: var(--sp-md);
    }

    /* This rule is load-bearing. Nothing in the project defines [hidden], and
       the browser's own `[hidden] { display: none }` comes from the UA
       stylesheet, which any author class selector beats. Without it the
       `display: flex` above wins and every mode's fields show at once, which
       is exactly what made the Size group unreadable. */
    .reveal[hidden], .reveal-text[hidden] { display: none; }

    /* Visually hidden but still announced: used where the mode already names
       what the number is, so the label would only repeat it on screen. */
    .vh {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
    }

    /* ---------- one of a few: segmented ---------- */

    .seg {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 2px;
        padding: 2px;
        background: var(--surface-hover);
        border: 1px solid var(--surface-border);
        border-radius: 20px;
        width: fit-content;
        max-width: 100%;
    }

    .seg-opt {
        display: inline-flex;
        align-items: center;
        height: calc(var(--control-h) - 6px);
        padding: 0 11px;
        border-radius: 20px;
        font-size: 0.75rem;
        color: var(--text-secondary);
        cursor: pointer;
        white-space: nowrap;
        transition: all var(--ease);
    }
    .seg-opt input { position: absolute; opacity: 0; pointer-events: none; }
    .seg-opt:hover { color: var(--text-primary); }
    .seg-opt:has(input:checked) {
        background: var(--accent);
        color: #fff;
        font-weight: 500;
    }
    .seg-opt:has(input:focus-visible) { outline: 2px solid var(--accent-bright); outline-offset: 1px; }

    /* A choice the server would refuse anyway: visible, but not selectable. */
    .seg-opt.is-off {
        opacity: 0.4;
        cursor: not-allowed;
        text-decoration: line-through;
    }
    .seg-opt.is-off:hover { color: var(--text-secondary); }

    /* ---------- independent on/off: switch ---------- */

    .sw {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: var(--control-h);
        font-size: 0.78rem;
        color: var(--text-secondary);
        cursor: pointer;
        user-select: none;
    }
    .sw input { position: absolute; opacity: 0; pointer-events: none; }

    .sw-track {
        position: relative;
        width: 28px;
        height: 16px;
        border-radius: 10px;
        background: var(--surface-hover);
        border: 1px solid var(--surface-border);
        flex-shrink: 0;
        transition: all var(--ease);
    }
    .sw-track::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--text-muted);
        transition: all var(--ease);
    }
    .sw:hover .sw-track { border-color: var(--accent-dim); }
    .sw:has(input:checked) { color: var(--text-primary); }
    .sw:has(input:checked) .sw-track {
        background: var(--accent);
        border-color: var(--accent-bright);
    }
    .sw:has(input:checked) .sw-track::after { left: 14px; background: #fff; }
    .sw:has(input:focus-visible) .sw-track { outline: 2px solid var(--accent-bright); outline-offset: 2px; }

    /* ---------- a magnitude: number with its unit ---------- */

    .num { display: inline-flex; align-items: stretch; max-width: 100%; }

    .num input {
        width: 82px;
        min-width: 0;
        height: var(--control-h);
        box-sizing: border-box;
        padding: 0 8px;
        background: var(--surface-hover);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-sm) 0 0 var(--radius-sm);
        color: var(--text-primary);
        font-family: var(--font-mono);
        font-size: 0.78rem;
    }
    .num input:focus {
        outline: none;
        border-color: var(--accent);
        background: var(--surface-border);
    }

    .num-unit {
        display: inline-flex;
        align-items: center;
        height: var(--control-h);
        box-sizing: border-box;
        padding: 0 8px;
        background: var(--surface-card);
        border: 1px solid var(--surface-border);
        border-left: 0;
        border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: var(--text-muted);
        flex-shrink: 0;
    }

    .txt {
        width: 100%;
        height: var(--control-h);
        box-sizing: border-box;
        padding: 0 10px;
        background: var(--surface-hover);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-sm);
        color: var(--text-primary);
        font-size: 0.82rem;
    }
    .txt:focus { outline: none; border-color: var(--accent); background: var(--surface-border); }

    .og-body select {
        height: var(--control-h);
        box-sizing: border-box;
        padding: 0 8px;
        background: var(--surface-hover);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-sm);
        color: var(--text-primary);
        font-size: 0.78rem;
        max-width: 100%;
    }
    .og-body select:focus { outline: none; border-color: var(--accent); }

    /* ---------- a position: 3x3 grid, shaped like the thing it sets ---------- */

    .wm-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 3px;
        width: 72px;
    }

    .wm-cell { cursor: pointer; }
    .wm-cell input[type="radio"] { position: absolute; opacity: 0; pointer-events: none; }

    .wm-cell span {
        display: block;
        aspect-ratio: 1;
        border-radius: var(--radius-sm);
        border: 1px solid var(--surface-border);
        background: var(--surface-hover);
        transition: all var(--ease);
    }
    .wm-cell:hover span { border-color: var(--accent-dim); }
    .wm-cell input:checked + span {
        background: var(--accent);
        border-color: var(--accent-bright);
    }
    .wm-cell input:focus-visible + span { outline: 2px solid var(--accent-bright); outline-offset: 2px; }

    /* ---------- notes ---------- */

    .format-note {
        display: flex;
        gap: var(--sp-sm);
        padding: var(--sp-md) var(--sp-lg);
        margin-top: var(--sp-lg);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        background: var(--surface-card);
        font-size: 0.78rem;
        color: var(--text-secondary);
        line-height: 1.5;
    }

    .format-note .icon { margin-top: 2px; flex-shrink: 0; }
    .format-note.accent { border-color: rgba(139,92,246,0.3); color: var(--accent-bright); }

    .batch-info-panel ul {
        list-style: none;
        margin: 0 0 var(--sp-sm);
        padding: 0;
        font-size: 0.76rem;
        color: var(--text-secondary);
    }
    .batch-info-panel ul:last-child { margin-bottom: 0; }

    .batch-info-panel li {
        padding-left: var(--sp-md);
        position: relative;
        margin-bottom: 3px;
    }

    .batch-info-panel li::before {
        content: "";
        position: absolute;
        left: 4px;
        top: 7px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--accent-dim);
    }

    .img-detail { font-family: var(--font-mono); color: var(--text-primary); }

    /* ---------- sticky run bar: the summary and the one action ---------- */

    .run-bar {
        position: sticky;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--sp-md);
        margin-top: var(--sp-xl);
        padding: var(--sp-md) var(--sp-lg);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        background: var(--surface-hover);
    }

    .run-sum {
        flex: 1;
        min-width: 0;
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: var(--text-secondary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .run-bar .btn { flex-shrink: 0; }

    /* The shared tooltip is a fixed 200px in base.html, centred on its button.
       Centring is what pushes it off screen for any control near an edge, and
       no width alone fixes that, so the transform carries a nudge the script
       sets after measuring. Default 0, i.e. centred, when no script runs. */
    .og-body .tip::after,
    .opt-group .tip::after {
        width: min(220px, calc(100vw - 2.5rem));
        max-width: 220px;
        transform: translateX(calc(-50% + var(--tip-nudge, 0px)));
    }

    @media (max-width: 480px) {
        .resize-card { padding: var(--sp-lg) var(--sp-md); }
        .og-body { padding: var(--sp-md); gap: var(--sp-md); }
        .opt-group > summary { padding: var(--sp-sm) var(--sp-md); }
        .row { gap: var(--sp-md); }
        .num input { width: 64px; }
        .run-bar { flex-direction: column; align-items: stretch; }
        .run-bar .btn { width: 100%; }
        .run-sum { text-align: center; white-space: normal; }
    }
</style>
